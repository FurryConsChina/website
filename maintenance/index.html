<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>请坐和放宽 · 兽展日历</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        height: 100%;
      }

      body {
        min-height: 100vh;
        background: #0078d7;
        color: #fff;
        font-family: "Segoe UI", "Microsoft YaHei", "PingFang SC", "Hiragino Sans GB", sans-serif;
      }

      main {
        min-height: 100vh;
        padding: 10vh 10vw 8vh;
      }

      .face {
        display: flex;
        align-items: center;
        gap: 0.1em;
        height: 1em;
        margin: 0 0 0.2em;
        color: #fff;
        font-size: 180px;
      }

      .colon {
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        height: 0.55em;
      }

      .colon i {
        display: block;
        width: 0.09em;
        height: 0.09em;
        border-radius: 50%;
        background: currentColor;
      }

      .paren {
        width: 1.36em;
        height: 1em;
        border: 0.06em solid currentColor;
        border-radius: 50%;
        clip-path: inset(0 76% 0 0);
      }

      h1 {
        margin-bottom: 12px;
        font-size: 28px;
        font-weight: 400;
        line-height: 1.4;
      }

      .copy,
      .progress {
        max-width: 34em;
        font-size: 22px;
        font-weight: 400;
        line-height: 1.55;
      }

      .progress {
        margin-top: 20px;
        max-width: 46em;
      }

      .progress-value {
        display: inline-block;
        font-family: "Cascadia Mono", Consolas, Menlo, "Liberation Mono", monospace;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }

      .details {
        display: flex;
        gap: 24px;
        align-items: flex-start;
        margin-top: 48px;
        max-width: 42em;
      }

      .qr {
        flex: 0 0 118px;
        width: 118px;
        height: 118px;
        padding: 8px;
        background: #fff;
      }

      .qr svg {
        display: block;
        width: 100%;
        height: 100%;
      }

      .help {
        font-size: 15px;
        line-height: 1.6;
      }

      .help a {
        color: #fff;
        text-decoration: underline;
      }

      .help p + p {
        margin-top: 16px;
      }

      .stop-code {
        margin-top: 4px;
      }

      @media (max-width: 720px) {
        main {
          padding: 8vh 24px 32px;
        }

        .face {
          font-size: 108px;
        }

        h1 {
          font-size: 24px;
        }

        .copy,
        .progress {
          font-size: 18px;
        }

        .details {
          flex-direction: column;
          gap: 16px;
          margin-top: 32px;
        }
      }
    </style>
  </head>

    </main>
    <script>
      const percent = document.getElementById("percent");
      const START = Date.parse("2026-10-11T21:00:00+08:00");
      const END = Date.parse("2026-10-12T00:00:00+08:00");

      const render = () => {
        const ratio = (Date.now() - START) / (END - START);
        const value = Math.min(100, Math.max(0, ratio * 100));
        percent.textContent = value.toFixed(4);

        if (value < 100) {
          requestAnimationFrame(render);
        }
      };

      render();
    </script>
